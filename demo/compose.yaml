services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=vendorflow'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready" -U myuser -d vendorflow]
        interval: 5s
        timeout: 3s
        retries: 10

volumes:
  pgdata:




